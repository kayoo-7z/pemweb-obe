<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portal inventaris laboratorium Teknik Komputer">
  <title>WebLab - Inventaris Laboratorium</title>
</head>
<body>

  <header>
    <a href="#main">Lewati ke konten utama</a>
    <h1>WebLab</h1>
    <nav aria-label="Navigasi utama">
      <a href="#layanan">Layanan</a>
      <a href="#kontak">Kontak</a>
    </nav>
  </header>

  <main id="main">
    <section id="beranda">
      <h2>Beranda</h2>
      <!-- Alt 1: Informatif -->
      <img src="laboratorium.jpg" alt="Suasana ruang Laboratorium Teknik Komputer">
      <!-- Alt 2: Dekoratif -->
      <img src="pattern.png" alt="">
      <p>Portal inventaris laboratorium.</p>
    </section>

    <section id="layanan">
      <h2>Layanan Inventaris</h2>
      <article>
        <h3>Pencatatan Peralatan</h3>
        <!-- Alt 3: Informatif -->
        <img src="peralatan.jpg" alt="Papan mikrokontroler Arduino Uno dalam kondisi baik">
        <p>Mencatat data alat dan status kondisi.</p>
      </article>
      <!-- Alt 4: Dekoratif -->
      <img src="divider.png" alt="">
      
      <!-- Alt 5: Gambar sebagai Link -->
      <p>Hubungi admin via WhatsApp:</p>
      <a href="https://wa.me/628123456789">
        <img src="icon-wa.png" alt="Hubungi Admin Laboratorium via WhatsApp">
      </a>
    </section>

    <section id="kontak">
      <h2>Kontak</h2>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
        <button type="submit">Kirim</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 WebLab</p>
  </footer>

</body>
</html>
